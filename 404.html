<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>ページが見つかりません | PYOKO</title>
<style>
  :root {
    color-scheme: light;
    /* Shared PYOKO / product tokens. Keep this standalone page aligned with
       index.html because Cloudflare Pages serves it without the app shell. */
    --ink: #24352F;
    --ink-soft: #5F6D66;
    --paper: #F5F5F1;
    --paper-card: #FFFFFF;
    --line: #D6DED8;
    --brand-surface: #143D33;
    --brand-primary: var(--brand-surface);
    --brand-on-primary: #FFF9F0;
    --brand-accent-coral: #F28B78;
    --brand-accent-lime: #B7CF71;
    --product-primary: #1F6B48;
    --product-primary-hover: #164C35;
    --product-on-primary: #FFFFFF;
    --pyoko-font: "Avenir Next", "Trebuchet MS", "Helvetica Neue", Arial, sans-serif;
    --font-sans: "Hiragino Sans", "Yu Gothic", Meiryo, -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; }

  html { min-height: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    color: var(--ink);
    background: var(--paper);
    font-family: var(--font-sans);
  }

  main {
    width: min(100%, 560px);
    padding: clamp(24px, 5vw, 36px);
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--paper-card);
    box-shadow: 0 12px 36px rgba(36, 53, 47, .08);
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
  }

  .pyoko-lockup {
    display: inline-flex;
    min-width: 0;
    flex-direction: column;
    align-items: flex-start;
    color: var(--brand-primary);
    text-decoration: none;
  }

  .pyoko-wordmark {
    display: inline-flex;
    align-items: baseline;
    color: var(--brand-primary);
    font-family: var(--pyoko-font);
    font-size: clamp(38px, 10vw, 48px);
    font-weight: 800;
    letter-spacing: .045em;
    line-height: .86;
  }

  .pyoko-letter {
    display: inline-block;
    position: relative;
  }

  .pyoko-letter--orbit {
    color: var(--brand-accent-lime);
    transform: translateY(-.025em);
  }

  .pyoko-letter--hop {
    color: var(--brand-accent-coral);
    transform: translateY(-.115em);
  }

  .pyoko-letter--hop::after {
    content: "";
    position: absolute;
    top: -.02em;
    right: -.08em;
    width: .22em;
    height: .07em;
    border-radius: 999px;
    background: var(--brand-accent-lime);
    transform: rotate(-18deg);
  }

  .pyoko-context {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 100%;
    margin: 12px 0 0;
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .015em;
    line-height: 1.45;
  }

  .pyoko-context-prefix {
    color: var(--brand-primary);
    font-family: var(--pyoko-font);
    font-weight: 700;
    letter-spacing: .08em;
  }

  .pyoko-context-unofficial {
    color: var(--ink-soft);
    font-family: var(--pyoko-font);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .05em;
  }

  .language-switch {
    display: inline-flex;
    flex: 0 0 auto;
    align-items: center;
    gap: 2px;
    padding: 2px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper-card);
  }

  .language-switch button {
    min-width: 44px;
    min-height: 44px;
    padding: 8px 10px;
    border: 0;
    border-radius: 999px;
    color: var(--ink-soft);
    background: transparent;
    font: 600 12px/1.2 var(--font-sans);
    white-space: nowrap;
    cursor: pointer;
  }

  .language-switch button:hover {
    color: var(--product-primary-hover);
  }

  .language-switch button.is-active {
    color: var(--product-on-primary);
    background: var(--product-primary);
    font-weight: 700;
  }

  .message {
    margin-top: 32px;
  }

  h1 {
    max-width: 100%;
    margin: 0 0 12px;
    color: var(--ink);
    font-size: clamp(24px, 5vw, 34px);
    line-height: 1.2;
    text-wrap: balance;
  }

  .message-copy {
    max-width: 44rem;
    margin: 0 0 20px;
    color: var(--ink-soft);
    font-size: 16px;
    line-height: 1.7;
  }

  .home-link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 10px 0;
    color: var(--product-primary);
    font-weight: 700;
    text-underline-offset: 4px;
  }

  .home-link:hover {
    color: var(--product-primary-hover);
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .pyoko-lockup:focus-visible,
  .language-switch button:focus-visible,
  .home-link:focus-visible {
    outline: 3px solid var(--product-primary);
    outline-offset: 4px;
  }

  @media (max-width: 520px) {
    .card-header {
      display: block;
    }

    .language-switch {
      margin-top: 20px;
    }

    .message {
      margin-top: 28px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
<main id="main">
  <header class="card-header">
    <div>
      <a class="pyoko-lockup" href="/" aria-label="PYOKO home" data-copy-aria-label="brandAria">
        <span class="pyoko-wordmark" aria-hidden="true"><span class="pyoko-letter">P</span><span class="pyoko-letter">Y</span><span class="pyoko-letter pyoko-letter--orbit">O</span><span class="pyoko-letter">K</span><span class="pyoko-letter pyoko-letter--hop">O</span></span>
        <span class="visually-hidden">PYOKO</span>
      </a>
      <p class="pyoko-context">
        <span class="pyoko-context-prefix">for</span>
        <span data-copy="descriptor">東京・ミュージアム ぐるっとパス</span>
        <span aria-hidden="true">·</span>
        <span class="pyoko-context-unofficial" data-copy="unofficial">非公式</span>
      </p>
    </div>
    <nav class="language-switch" aria-label="言語" data-copy-aria-label="languageLabel">
      <button type="button" data-lang="ja" aria-pressed="true">日本語</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="zh" aria-pressed="false">中文</button>
    </nav>
  </header>

  <section class="message" aria-labelledby="notFoundHeading">
    <h1 id="notFoundHeading" data-copy="heading">ページが見つかりません</h1>
    <p class="message-copy" data-copy="body">お探しのページは存在しないか、移動または削除された可能性があります。</p>
    <a class="home-link" href="/" data-copy="home">トップページへ戻る</a>
  </section>
</main>
<script>
  (() => {
    const COPY = {
      ja: {
        title: 'ページが見つかりません | PYOKO',
        descriptor: '東京・ミュージアム ぐるっとパス',
        unofficial: '非公式',
        heading: 'ページが見つかりません',
        body: 'お探しのページは存在しないか、移動または削除された可能性があります。',
        home: 'トップページへ戻る',
        languageLabel: '言語',
        brandAria: 'PYOKO ホーム'
      },
      en: {
        title: 'Page not found | PYOKO',
        descriptor: 'Tokyo Museum Grutto Pass',
        unofficial: 'Unofficial',
        heading: 'Page not found',
        body: 'The page you’re looking for may have moved, been removed, or never existed.',
        home: 'Back to home',
        languageLabel: 'Language',
        brandAria: 'PYOKO home'
      },
      zh: {
        title: '找不到页面 | PYOKO',
        descriptor: '东京·博物馆 Grutto Pass',
        unofficial: '非官方',
        heading: '找不到页面',
        body: '你访问的页面可能已移动、删除，或从未存在。',
        home: '返回首页',
        languageLabel: '语言',
        brandAria: 'PYOKO 首页'
      }
    };
    const SUPPORTED_LANGUAGES = ['ja', 'en', 'zh'];
    const LANGUAGE_STORAGE_KEY = 'grutto-pass-lang';

    function normalizeLanguage(value) {
      const normalized = String(value || '').toLowerCase();
      if (normalized.startsWith('zh')) return 'zh';
      if (normalized.startsWith('en')) return 'en';
      return 'ja';
    }

    function initialLanguage() {
      let queryLanguage = '';
      try { queryLanguage = new URL(window.location.href).searchParams.get('lang') || ''; } catch {}
      if (queryLanguage) return normalizeLanguage(queryLanguage);

      try {
        const stored = window.localStorage.getItem(LANGUAGE_STORAGE_KEY);
        if (stored) return normalizeLanguage(stored);
      } catch {}

      return normalizeLanguage(window.navigator.language || 'ja');
    }

    function applyLanguage(language, updateUrl = false) {
      const next = SUPPORTED_LANGUAGES.includes(language) ? language : 'ja';
      const copy = COPY[next];
      document.documentElement.lang = next;
      document.title = copy.title;
      document.querySelectorAll('[data-copy]').forEach(element => {
        element.textContent = copy[element.dataset.copy];
      });
      document.querySelectorAll('[data-copy-aria-label]').forEach(element => {
        element.setAttribute('aria-label', copy[element.dataset.copyAriaLabel]);
      });
      document.querySelectorAll('[data-lang]').forEach(button => {
        const isActive = button.dataset.lang === next;
        button.classList.toggle('is-active', isActive);
        button.setAttribute('aria-pressed', String(isActive));
      });

      try { window.localStorage.setItem(LANGUAGE_STORAGE_KEY, next); } catch {}
      if (updateUrl) {
        try {
          const url = new URL(window.location.href);
          url.searchParams.set('lang', next);
          window.history.replaceState(null, '', url.href);
        } catch {}
      }
    }

    document.querySelectorAll('[data-lang]').forEach(button => {
      button.addEventListener('click', () => applyLanguage(button.dataset.lang, true));
    });

    applyLanguage(initialLanguage());
  })();
</script>
</body>
</html>

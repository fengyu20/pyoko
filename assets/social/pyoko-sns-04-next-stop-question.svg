<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">PYOKO — 不是东京有哪些馆，而是我下一站去哪？</title>
  <desc id="desc">A PYOKO Forest brand card reframing museum discovery as a next-stop decision.</desc>
  <style>
    .wordmark{font-family:'Avenir Next','Trebuchet MS','Helvetica Neue',Arial,sans-serif;font-size:116px;font-weight:800;letter-spacing:8px}
    .cjk{font-family:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif}
    .sans{font-family:'Avenir Next','Trebuchet MS','Helvetica Neue',Arial,sans-serif}
  </style>
  <rect width="1080" height="1350" fill="#143D33"/>

  <rect x="72" y="72" width="160" height="58" rx="29" fill="#DDEEE2"/>
  <text x="152" y="111" text-anchor="middle" class="sans" font-size="25" font-weight="700" letter-spacing="1" fill="#164C35">04 / 04</text>

  <g aria-label="PYOKO wordmark">
    <text x="72" y="242" textLength="172" lengthAdjust="spacingAndGlyphs" class="wordmark" fill="#FFF9F0">PY</text>
    <text x="267" y="242" textLength="78" lengthAdjust="spacingAndGlyphs" class="wordmark" fill="#B7CF71">O</text>
    <text x="365" y="242" textLength="82" lengthAdjust="spacingAndGlyphs" class="wordmark" fill="#FFF9F0">K</text>
    <text x="505" y="224" textLength="80" lengthAdjust="spacingAndGlyphs" class="wordmark" fill="#F28B78">O</text>
    <path d="M606 121l26-10" fill="none" stroke="#B7CF71" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="72" y="292" class="sans" font-size="22" font-weight="700" letter-spacing="2" fill="#B7CF71">for</text>
  <text x="136" y="292" class="cjk" font-size="22" fill="#DCE1D6">东京·博物馆 Grutto Pass</text>
  <text x="550" y="292" class="cjk" font-size="20" fill="#C0C9BD">· 非官方指南</text>

  <text x="72" y="450" class="cjk" font-size="62" font-weight="800" fill="#FFF9F0">PYOKO 想解决的</text>
  <text x="72" y="530" class="cjk" font-size="62" font-weight="800" fill="#FFF9F0">不是“东京有哪些馆”</text>
  <text x="72" y="610" class="cjk" font-size="62" font-weight="800" fill="#DCE1D6">而是</text>
  <rect x="72" y="652" width="730" height="96" rx="26" fill="#FFF9F0"/>
  <text x="112" y="717" class="cjk" font-size="56" font-weight="800" fill="#143D33">“我下一站去哪？”</text>
  <rect x="74" y="782" width="330" height="6" rx="3" fill="#B7CF71"/>
  <text x="72" y="846" class="cjk" font-size="29" fill="#DCE1D6">把做决定时真正需要的信息，放在一起。</text>

  <rect x="72" y="900" width="936" height="250" rx="28" fill="#FFF9F0" stroke="#D6DED8" stroke-width="2"/>
  <text x="112" y="952" class="sans" font-size="17" font-weight="700" letter-spacing="2" fill="#1F6B48">ONE DECISION LAYER</text>

  <circle cx="176" cy="1020" r="30" fill="#DDEEE2" stroke="#1F6B48" stroke-width="3"/>
  <path d="M176 1003v18l12 8" fill="none" stroke="#1F6B48" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="176" y="1088" text-anchor="middle" class="cjk" font-size="24" font-weight="700" fill="#24352F">今天开不开</text>

  <circle cx="540" cy="1020" r="30" fill="#DDEEE2" stroke="#1F6B48" stroke-width="3"/>
  <path d="M523 1008h34v27h-34zM529 1001h22" fill="none" stroke="#1F6B48" stroke-width="3" stroke-linejoin="round"/>
  <text x="540" y="1088" text-anchor="middle" class="cjk" font-size="24" font-weight="700" fill="#24352F">Pass 怎么用</text>

  <circle cx="904" cy="1020" r="30" fill="#DDEEE2" stroke="#1F6B48" stroke-width="3"/>
  <rect x="888" y="1004" width="32" height="32" rx="4" fill="none" stroke="#1F6B48" stroke-width="3"/>
  <circle cx="897" cy="1013" r="4" fill="#1F6B48"/>
  <path d="M892 1027l8-8 6 6 6-6 7 8" fill="none" stroke="#1F6B48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="904" y="1088" text-anchor="middle" class="cjk" font-size="24" font-weight="700" fill="#24352F">现在展什么</text>

  <path d="M206 1020 C306 962 410 962 510 1020 S714 1078 874 1020" fill="none" stroke="#B7CF71" stroke-width="6" stroke-linecap="round"/>
  <circle cx="206" cy="1020" r="8" fill="#B7CF71"/>
  <circle cx="540" cy="1020" r="8" fill="#DCE1D6"/>
  <circle cx="874" cy="1020" r="10" fill="#F28B78"/>

  <text x="72" y="1272" class="sans" font-size="18" font-weight="600" letter-spacing="3" fill="#C0C9BD">ONE PLACE, THEN THE NEXT · PYOKO</text>
</svg>

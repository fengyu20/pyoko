<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">PYOKO — 通票买了，下一站去哪？</title>
  <desc id="desc">PYOKO 的 Forest editorial social card introducing the question of choosing the next museum stop.</desc>
  <style>
    .wordmark{font-family:'Avenir Next','Trebuchet MS','Helvetica Neue',Arial,sans-serif;font-size:116px;font-weight:800;letter-spacing:8px}
    .cjk{font-family:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif}
    .sans{font-family:'Avenir Next','Trebuchet MS','Helvetica Neue',Arial,sans-serif}
  </style>
  <rect width="1080" height="1350" fill="#143D33"/>

  <rect x="72" y="72" width="160" height="58" rx="29" fill="#DDEEE2"/>
  <text x="152" y="111" text-anchor="middle" class="sans" font-size="25" font-weight="700" letter-spacing="1" fill="#164C35">01 / 04</text>

  <g aria-label="PYOKO wordmark">
    <text x="72" y="242" textLength="172" lengthAdjust="spacingAndGlyphs" class="wordmark" fill="#FFF9F0">PY</text>
    <text x="267" y="242" textLength="78" lengthAdjust="spacingAndGlyphs" class="wordmark" fill="#B7CF71">O</text>
    <text x="365" y="242" textLength="82" lengthAdjust="spacingAndGlyphs" class="wordmark" fill="#FFF9F0">K</text>
    <text x="505" y="224" textLength="80" lengthAdjust="spacingAndGlyphs" class="wordmark" fill="#F28B78">O</text>
    <path d="M606 121l26-10" fill="none" stroke="#B7CF71" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="72" y="292" class="sans" font-size="22" font-weight="700" letter-spacing="2" fill="#B7CF71">for</text>
  <text x="136" y="292" class="cjk" font-size="22" fill="#DCE1D6">东京·博物馆 Grutto Pass</text>
  <text x="550" y="292" class="cjk" font-size="20" fill="#C0C9BD">· 非官方指南</text>

  <text x="72" y="500" class="cjk" font-size="92" font-weight="800" fill="#FFF9F0">通票买了，</text>
  <text x="72" y="612" class="cjk" font-size="92" font-weight="800" fill="#FFF9F0">下一站去哪？</text>
  <rect x="74" y="666" width="330" height="6" rx="3" fill="#B7CF71"/>

  <text x="72" y="742" class="cjk" font-size="30" fill="#DCE1D6">Grutto Pass 让你进入东京的</text>
  <text x="72" y="790" class="cjk" font-size="30" fill="#DCE1D6">100+ 文化设施。</text>

  <path d="M82 947 C242 858 418 862 572 946 S828 1028 984 902" fill="none" stroke="#2B594B" stroke-width="4"/>
  <path d="M82 947 C242 858 418 862 572 946" fill="none" stroke="#B7CF71" stroke-width="8" stroke-linecap="round"/>
  <circle cx="82" cy="947" r="10" fill="#B7CF71"/>
  <circle cx="350" cy="873" r="8" fill="#B7CF71"/>
  <circle cx="572" cy="946" r="9" fill="#DCE1D6"/>
  <circle cx="984" cy="902" r="11" fill="#F28B78"/>

  <rect x="578" y="1010" width="426" height="226" rx="26" fill="#FFF9F0" stroke="#D6DED8" stroke-width="2"/>
  <text x="614" y="1060" class="sans" font-size="17" font-weight="700" letter-spacing="2" fill="#1F6B48">PYOKO / NEXT STOP</text>
  <text x="614" y="1118" class="sans" font-size="34" font-weight="700" fill="#24352F">one place,</text>
  <text x="614" y="1164" class="sans" font-size="34" font-weight="700" fill="#24352F">then the next.</text>
  <circle cx="928" cy="1100" r="17" fill="#DDEEE2"/>
  <circle cx="964" cy="1140" r="17" fill="#B7CF71"/>
  <path d="M928 1100c17 0 25 10 36 40" fill="none" stroke="#1F6B48" stroke-width="3" stroke-linecap="round"/>
  <circle cx="964" cy="1140" r="7" fill="#F28B78"/>

  <text x="72" y="1272" class="sans" font-size="18" font-weight="600" letter-spacing="3" fill="#C0C9BD">INDEPENDENT CULTURAL GUIDE · PYOKO</text>
</svg>

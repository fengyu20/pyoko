<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">PYOKO — 把决定时最常查的几件事放到一起</title>
  <desc id="desc">PYOKO product proof card showing opening status, Pass use and current exhibition information in one facility detail view.</desc>
  <style>
    .wordmark{font-family:'Avenir Next','Trebuchet MS','Helvetica Neue',Arial,sans-serif;font-size:74px;font-weight:800;letter-spacing:5px}
    .cjk{font-family:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif}
    .sans{font-family:'Avenir Next','Trebuchet MS','Helvetica Neue',Arial,sans-serif}
  </style>
  <rect width="1080" height="1350" fill="#F5F5F1"/>

  <rect x="72" y="72" width="160" height="58" rx="29" fill="#DDEEE2"/>
  <text x="152" y="111" text-anchor="middle" class="sans" font-size="25" font-weight="700" letter-spacing="1" fill="#164C35">03 / 04</text>

  <text x="72" y="205" class="cjk" font-size="68" font-weight="800" fill="#143D33">做决定时，</text>
  <text x="72" y="286" class="cjk" font-size="68" font-weight="800" fill="#143D33">最常查的几件事</text>
  <text x="72" y="367" class="cjk" font-size="68" font-weight="800" fill="#143D33">放到一起。</text>

  <rect x="72" y="430" width="936" height="658" rx="28" fill="#FFFFFF" stroke="#D6DED8" stroke-width="2"/>
  <text x="112" y="482" class="sans" font-size="17" font-weight="700" letter-spacing="2" fill="#5F6D66">PYOKO / PRODUCT VIEW</text>
  <rect x="800" y="450" width="164" height="42" rx="21" fill="#DDEEE2"/>
  <text x="882" y="477" text-anchor="middle" class="sans" font-size="14" font-weight="700" letter-spacing="1" fill="#164C35">OPEN NOW</text>
  <text x="112" y="548" class="cjk" font-size="38" font-weight="700" fill="#24352F">Facility detail</text>
  <text x="112" y="586" class="cjk" font-size="21" fill="#5F6D66">一个页面里，先看到决定下一站所需的信息。</text>
  <line x1="112" y1="625" x2="968" y2="625" stroke="#E7ECE8" stroke-width="2"/>

  <circle cx="154" cy="694" r="28" fill="#DDEEE2" stroke="#1F6B48" stroke-width="3"/>
  <path d="M142 694l9 9 17-20" fill="none" stroke="#1F6B48" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="210" y="687" class="cjk" font-size="29" font-weight="700" fill="#143D33">今天开不开</text>
  <text x="210" y="722" class="cjk" font-size="19" fill="#5F6D66">opening status / last admission</text>
  <rect x="724" y="670" width="214" height="54" rx="27" fill="#DDEEE2"/>
  <text x="831" y="704" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#164C35">OPEN / CHECK</text>
  <line x1="112" y1="760" x2="968" y2="760" stroke="#E7ECE8" stroke-width="2"/>

  <circle cx="154" cy="830" r="28" fill="#DDEEE2" stroke="#1F6B48" stroke-width="3"/>
  <path d="M137 819h34v25h-34zM143 812h22" fill="none" stroke="#1F6B48" stroke-width="3" stroke-linejoin="round"/>
  <text x="210" y="823" class="cjk" font-size="29" font-weight="700" fill="#143D33">Pass 怎么用</text>
  <text x="210" y="858" class="cjk" font-size="19" fill="#5F6D66">eligibility / benefit scope / source</text>
  <rect x="724" y="806" width="214" height="54" rx="27" fill="#F5F5F1" stroke="#D6DED8" stroke-width="2"/>
  <text x="831" y="840" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#164C35">PASS INFO</text>
  <line x1="112" y1="898" x2="968" y2="898" stroke="#E7ECE8" stroke-width="2"/>

  <circle cx="154" cy="968" r="28" fill="#DDEEE2" stroke="#1F6B48" stroke-width="3"/>
  <rect x="139" y="953" width="30" height="30" rx="4" fill="none" stroke="#1F6B48" stroke-width="3"/>
  <circle cx="148" cy="962" r="4" fill="#1F6B48"/>
  <path d="M143 976l8-8 6 6 5-5 7 7" fill="none" stroke="#1F6B48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="210" y="961" class="cjk" font-size="29" font-weight="700" fill="#143D33">现在展什么</text>
  <text x="210" y="996" class="cjk" font-size="19" fill="#5F6D66">current exhibition / dates / official source</text>
  <rect x="724" y="944" width="214" height="54" rx="27" fill="#F5F5F1" stroke="#D6DED8" stroke-width="2"/>
  <text x="831" y="978" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#164C35">EXHIBITION</text>

  <path d="M154 1000 C154 1054 282 1044 390 1044 S570 1026 650 1044" fill="none" stroke="#B7CF71" stroke-width="6" stroke-linecap="round"/>
  <circle cx="154" cy="1000" r="7" fill="#B7CF71"/>
  <circle cx="650" cy="1044" r="9" fill="#F28B78"/>

  <rect x="162" y="1140" width="756" height="74" rx="37" fill="#DDEEE2"/>
  <circle cx="210" cy="1177" r="21" fill="#143D33"/>
  <path d="M200 1177l7 7 14-16" fill="none" stroke="#FFF9F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="258" y="1188" class="cjk" font-size="28" font-weight="700" fill="#143D33">把信息放到一起，才好选下一站。</text>

  <g aria-label="PYOKO wordmark">
    <text x="72" y="1287" textLength="110" lengthAdjust="spacingAndGlyphs" class="wordmark" fill="#143D33">PY</text>
    <text x="196" y="1287" textLength="52" lengthAdjust="spacingAndGlyphs" class="wordmark" fill="#143D33" opacity=".64">O</text>
    <text x="260" y="1287" textLength="54" lengthAdjust="spacingAndGlyphs" class="wordmark" fill="#143D33">K</text>
    <text x="352" y="1274" textLength="54" lengthAdjust="spacingAndGlyphs" class="wordmark" fill="#F28B78">O</text>
    <path d="M421 1204l18-7" fill="none" stroke="#B7CF71" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="500" y="1272" class="cjk" font-size="20" fill="#5F6D66">for 东京·博物馆 Grutto Pass</text>
  <text x="500" y="1305" class="cjk" font-size="18" fill="#64716A">非官方指南</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">PYOKO — 只是想决定今晚去哪？</title>
  <desc id="desc">A PYOKO editorial card showing two practical checks that help decide the next museum stop with less back-and-forth.</desc>
  <style>
    .wordmark{font-family:'Avenir Next','Trebuchet MS','Helvetica Neue',Arial,sans-serif;font-size:74px;font-weight:800;letter-spacing:5px}
    .cjk{font-family:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif}
    .sans{font-family:'Avenir Next','Trebuchet MS','Helvetica Neue',Arial,sans-serif}
  </style>
  <rect width="1080" height="1350" fill="#F5F5F1"/>

  <rect x="72" y="72" width="160" height="58" rx="29" fill="#DDEEE2"/>
  <text x="152" y="111" text-anchor="middle" class="sans" font-size="25" font-weight="700" letter-spacing="1" fill="#164C35">02 / 04</text>

  <text x="72" y="222" class="cjk" font-size="74" font-weight="800" fill="#143D33">只是想决定</text>
  <text x="72" y="310" class="cjk" font-size="74" font-weight="800" fill="#143D33">今晚去哪？</text>
  <rect x="74" y="350" width="250" height="6" rx="3" fill="#B7CF71"/>
  <text x="72" y="410" class="cjk" font-size="30" fill="#5F6D66">以前得来回查好几地方。</text>

  <rect x="72" y="480" width="430" height="390" rx="28" fill="#FFFFFF" stroke="#D6DED8" stroke-width="2"/>
  <text x="112" y="534" class="sans" font-size="17" font-weight="700" letter-spacing="2" fill="#1F6B48">PASS INFO</text>
  <text x="112" y="604" class="cjk" font-size="31" font-weight="700" fill="#24352F">先确认能不能用</text>
  <line x1="112" y1="640" x2="462" y2="640" stroke="#E7ECE8" stroke-width="2"/>
  <circle cx="128" cy="687" r="9" fill="#DDEEE2" stroke="#1F6B48" stroke-width="3"/>
  <text x="154" y="694" class="sans" font-size="20" fill="#5F6D66">benefit / eligibility</text>
  <circle cx="128" cy="739" r="9" fill="#DDEEE2" stroke="#1F6B48" stroke-width="3"/>
  <text x="154" y="746" class="sans" font-size="20" fill="#5F6D66">official source</text>
  <rect x="112" y="790" width="290" height="44" rx="22" fill="#DDEEE2"/>
  <text x="257" y="818" text-anchor="middle" class="sans" font-size="15" font-weight="700" letter-spacing=".8" fill="#164C35">CHECK THE SCOPE</text>

  <rect x="578" y="480" width="430" height="390" rx="28" fill="#FFFFFF" stroke="#D6DED8" stroke-width="2"/>
  <text x="618" y="534" class="sans" font-size="17" font-weight="700" letter-spacing="1.5" fill="#1F6B48">OPENING STATUS</text>
  <text x="618" y="604" class="cjk" font-size="31" font-weight="700" fill="#24352F">再看今天开不开</text>
  <line x1="618" y1="640" x2="968" y2="640" stroke="#E7ECE8" stroke-width="2"/>
  <circle cx="634" cy="687" r="9" fill="#DDEEE2" stroke="#1F6B48" stroke-width="3"/>
  <text x="660" y="694" class="sans" font-size="20" fill="#5F6D66">hours / closures</text>
  <circle cx="634" cy="739" r="9" fill="#DDEEE2" stroke="#1F6B48" stroke-width="3"/>
  <text x="660" y="746" class="sans" font-size="20" fill="#5F6D66">last admission</text>
  <rect x="618" y="790" width="242" height="44" rx="22" fill="#F5F5F1" stroke="#D6DED8" stroke-width="2"/>
  <text x="739" y="818" text-anchor="middle" class="sans" font-size="15" font-weight="700" letter-spacing=".8" fill="#164C35">CHECK TODAY</text>

  <path d="M502 700 C526 672 552 672 578 700" fill="none" stroke="#B7CF71" stroke-width="6" stroke-linecap="round"/>
  <circle cx="502" cy="700" r="8" fill="#B7CF71"/>
  <circle cx="578" cy="700" r="9" fill="#F28B78"/>
  <path d="M532 668l17-6" fill="none" stroke="#B7CF71" stroke-width="6" stroke-linecap="round"/>

  <rect x="162" y="970" width="756" height="86" rx="43" fill="#DDEEE2"/>
  <circle cx="210" cy="1013" r="21" fill="#143D33"/>
  <path d="M200 1013l7 7 14-16" fill="none" stroke="#FFF9F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="258" y="1024" class="cjk" font-size="28" font-weight="700" fill="#143D33">少一点来回查，多一点决定下一站。</text>

  <g aria-label="PYOKO wordmark">
    <text x="72" y="1287" textLength="110" lengthAdjust="spacingAndGlyphs" class="wordmark" fill="#143D33">PY</text>
    <text x="196" y="1287" textLength="52" lengthAdjust="spacingAndGlyphs" class="wordmark" fill="#143D33" opacity=".64">O</text>
    <text x="260" y="1287" textLength="54" lengthAdjust="spacingAndGlyphs" class="wordmark" fill="#143D33">K</text>
    <text x="352" y="1274" textLength="54" lengthAdjust="spacingAndGlyphs" class="wordmark" fill="#F28B78">O</text>
    <path d="M421 1204l18-7" fill="none" stroke="#B7CF71" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="500" y="1272" class="cjk" font-size="20" fill="#5F6D66">for 东京·博物馆 Grutto Pass</text>
  <text x="500" y="1305" class="cjk" font-size="18" fill="#64716A">非官方指南</text>
</svg>
